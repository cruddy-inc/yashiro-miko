syntax = "proto3";

package yaotose.v1;

option go_package = "github.com/cruddy-inc/yashiro-miko/services/yaotose/internal/gen/yaotose/v1;yaotosev1";

message YaotoseData {
  repeated string rules = 1;
  int32 weight = 2;
}

message CurrentTransactionInfo {
  string segment = 1; 
  string untrusted_memo = 2;
  string original_currency = 3;
  int64 amount_eur_minor = 4;
  bool active_phone_call = 5;
  bool remote_access_detected = 6;
}

message PayerToPayeeInteraction {
  bool known_payee = 1;
  optional int32 n_payments = 2;
  optional int64 max_amount_sent_minor = 3;
  int32 transactions_within_1_hour = 4;
  int32 amount_sent_within_1_hour_minor = 5;
  int32 transactions_within_24_hour = 6;
  int32 amount_sent_within_24_hour_minor = 7;
  optional int64 first_transaction_unix = 8;
  optional int64 last_transaction_unix = 9;
  optional bool same_bank = 10;
  bool different_countries = 11;
}

message Envelope {
  string case_id = 1;
  string tenant_id = 2;
  string payer_iban_hash = 3;
  string payee_iban_hash = 4;
  string yaotose_decision = 5;
  YaotoseData rules_fired = 6;
  CurrentTransactionInfo current_transaction_info = 7;
  PayerToPayeeInteraction payer_to_payee_interaction = 8;
  string kafka_topic = 9;
  bytes kafka_case = 10;
}