[project]
name = "miko"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "confluent-kafka>=2.16.1",
    "fastapi>=0.163.1",
    "google-genai>=3.3.0",
    "grpcio>=1.85.1",
    "langgraph>=1.2.22",
    "openai>=3.51.0",
    "pgvector>=0.5.1",
    "protobuf>=7.36.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.14.1",
    "ruff>=0.17.5",
    "vcrpy>=9.4.2",
]
